schema:
  version: "1.0"
  description: "Example schema for user data"
  type: object
  properties:
    userId:
      type: string
      description: "Unique identifier for the user"
    userName:
      type: string
      description: "Name of the user"
    email:
      type: string
      format: email
      description: "Email address of the user"
    isActive:
      type: boolean
      description: "Indicates if the user is active"
  required:
    - userId
    - userName
    - email
$ref: "#/schema"